<!-- Make a bouncing ball animation. -->


<!DOCTYPE html>
<html>
<head>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #f4f4f4;
  margin: 0;
}

.ball {
  width: 80px;
  height: 80px;
  background-color: #ff4757;
  border-radius: 50%;
  animation: bounce 0.8s infinite ease-in-out;
}

@keyframes bounce {
  0% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-200px);
  }
  100% {
    transform: translateY(0);
  }
}
</style>
</head>
<body>

<div class="ball"></div>

</body>
</html>
