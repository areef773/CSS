<!-- Design a progress bar that fills using animation. -->


<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.progress-container {
  width: 400px;
  height: 25px;
  background-color: #ddd;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
}

.progress-bar {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #4facfe, #00f2fe);
  border-radius: 20px;
  animation: fillBar 3s forwards ease-in-out;
}

@keyframes fillBar {
  from {
    width: 0;
  }
  to {
    width: 80%;
  }
}
</style>
</head>
<body>

<div class="progress-container">
  <div class="progress-bar"></div>
</div>

</body>
</html>
