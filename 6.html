<!-- Make a pulsating button -->


<!DOCTYPE html>
<html>
<head>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #f4f4f4;
  margin: 0;
}

.pulse-btn {
  padding: 15px 35px;
  font-size: 18px;
  color: white;
  background: #ff6b81;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  animation: pulse 1.5s infinite;
}

/* Pulsating effect */
@keyframes pulse {
  0% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(255, 107, 129, 0.7);
  }
  70% {
    transform: scale(1.1);
    box-shadow: 0 0 0 20px rgba(255, 107, 129, 0);
  }
  100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(255, 107, 129, 0);
  }
}
</style>
</head>
<body>

<button class="pulse-btn">Click Me</button>

</body>
</html>
