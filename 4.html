<!-- Create a sliding menu using keyframes. -->

<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

/* Menu Button */
.menu-btn {
  position: absolute;
  top: 20px;
  left: 20px;
  padding: 10px 15px;
  background: #333;
  color: white;
  border: none;
  cursor: pointer;
}

/* Sidebar */
.sidebar {
  position: fixed;
  top: 0;
  left: -250px;
  width: 250px;
  height: 100%;
  background: #222;
  padding-top: 60px;
  animation: slideIn 0.5s forwards;
}

/* Menu Links */
.sidebar a {
  display: block;
  color: white;
  padding: 15px;
  text-decoration: none;
}

.sidebar a:hover {
  background: #444;
}

/* Keyframes */
@keyframes slideIn {
  from {
    left: -250px;
  }
  to {
    left: 0;
  }
}
</style>
</head>
<body>

<button class="menu-btn">Open Menu</button>

<div class="sidebar">
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</div>

</body>
</html>
