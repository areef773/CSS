<!-- Experiment with overlapping grid items. -->


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlapping Grid Items</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    padding: 40px;
}

/* Grid Container */
.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 150px);
    gap: 20px;
}

/* Base Box Style */
.box {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    color: white;
    border-radius: 10px;
}

/* Individual Boxes */
.box1 {
    background: #3498db;
    grid-column: 1 / 3;
    grid-row: 1 / 3;
}

.box2 {
    background: #e74c3c;
    grid-column: 2 / 4;
    grid-row: 2 / 4;
    z-index: 2; /* Overlaps on top */
    opacity: 0.9;
}

.box3 {
    background: #2ecc71;
}

.box4 {
    background: #9b59b6;
}

/* Responsive */
@media (max-width: 768px) {
    .grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
    }

    .box1,
    .box2 {
        grid-column: auto;
        grid-row: auto;
    }
}
</style>
</head>
<body>

<h1>Overlapping Grid Example</h1>

<div class="grid">
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2 (Overlapping)</div>
    <div class="box box3">Box 3</div>
    <div class="box box4">Box 4</div>
</div>

</body>
</html>
