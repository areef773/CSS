<!-- Build a pricing table with equal-sized boxes. -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Table</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    padding: 40px 20px;
}

h1 {
    text-align: center;
    margin-bottom: 40px;
}

/* Pricing Grid */
.pricing {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    align-items: stretch; /* Makes all boxes equal height */
}

/* Pricing Card */
.card {
    background: white;
    border-radius: 10px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.3s ease;
}

.card:hover {
    transform: translateY(-8px);
}

/* Highlighted Plan */
.popular {
    border: 2px solid #3498db;
    transform: scale(1.05);
}

/* Price */
.price {
    font-size: 32px;
    font-weight: bold;
    margin: 20px 0;
    color: #2c3e50;
}

/* Features */
.features {
    list-style: none;
    margin: 20px 0;
}

.features li {
    margin: 10px 0;
}

/* Button */
button {
    padding: 10px;
    border: none;
    border-radius: 5px;
    background: #3498db;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #2980b9;
}
</style>
</head>

<body>

<h1>Our Pricing Plans</h1>

<div class="pricing">

    <div class="card">
        <h2>Basic</h2>
        <div class="price">$19/mo</div>
        <ul class="features">
            <li>5 Projects</li>
            <li>Email Support</li>
            <li>Basic Analytics</li>
        </ul>
        <button>Choose Plan</button>
    </div>

    <div class="card popular">
        <h2>Standard</h2>
        <div class="price">$39/mo</div>
        <ul class="features">
            <li>15 Projects</li>
            <li>Priority Support</li>
            <li>Advanced Analytics</li>
        </ul>
        <button>Choose Plan</button>
    </div>

    <div class="card">
        <h2>Premium</h2>
        <div class="price">$59/mo</div>
        <ul class="features">
            <li>Unlimited Projects</li>
            <li>24/7 Support</li>
            <li>Full Analytics</li>
        </ul>
        <button>Choose Plan</button>
    </div>

</div>

</body>
</html>
